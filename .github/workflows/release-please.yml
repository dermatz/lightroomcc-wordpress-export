name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Release Please
        uses: googleapis/release-please-action@v4
        with:
          release-type: node
          package-name: lightroomcc-wordpress-export
          bootstrap-sha: ${{ github.sha }}
          last-release-sha: ${{ github.sha }}
          include-component-in-tag: false
          initial-version: 1.2.1
